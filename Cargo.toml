[package]
name = "pane-mux"
version = "0.1.0"
edition = "2024"
description = "A yazi-style picker for tmux sessions, windows and panes"

[dependencies]
anyhow = "1"
ansi-to-tui = "8"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["use-dev-tty"] }
ratatui = { version = "0.30", features = ["crossterm", "serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"

[dev-dependencies]
insta = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
