[package]
name = "pane-mux"
version = "0.2.0"
edition = "2024"
description = "A yazi-style picker for tmux sessions, windows and panes"
license = "MIT"
repository = "https://github.com/0xKahi/pane-mux"
homepage = "https://github.com/0xKahi/pane-mux"
readme = "README.md"
keywords = ["tmux", "picker", "tui", "terminal", "cli"]
categories = ["command-line-utilities"]
rust-version = "1.89"
include = ["src/**/*", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md"]

[dependencies]
anyhow = "1"
ansi-to-tui = "8"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["use-dev-tty"] }
ratatui = { version = "0.30", features = ["crossterm", "serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"

[dev-dependencies]
insta = "1"
schemars = "0.8"
serde_json = "1"
jsonschema = { version = "0.33", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
