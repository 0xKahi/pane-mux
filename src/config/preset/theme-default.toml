# Editor validation (Tombi, taplo): keep the #:schema line below.
#:schema https://raw.githubusercontent.com/0xKahi/pane-mux/main/schemas/theme.json

# Adapted from the user's yazi theme: reversed indicators, gray borders,
# green/blue mode labels, and yellow/red input and confirmation frames.
[picker]
border = { fg = "gray" }
session = { fg = "#82AAFF" }
window = { fg = "lightcyan" }
pane = { fg = "white" }
header = { fg = "lightgreen" }
find_keyword = { fg = "yellow", bold = true, italic = true, underline = true }
find_position = { fg = "magenta", bg = "reset", bold = true, italic = true }

[indicator]
parent = { reversed = true }
current = { reversed = true }
preview = { underline = true }
# Exact Powerline caps from the user's yazi theme, preserved as Unicode escapes.
padding = { open = "\uE0B6", close = "\uE0B4" }
active = { text = "*", fg = "magenta" }

[marker]
symbol = "│"
cut = { fg = "lightred", bg = "lightred" }
badge_cut = { fg = "white", bg = "red" }

[preview]
border = { fg = "gray" }
title = { fg = "lightcyan" }

[icons]
# Nerd Font glyphs, stored as Unicode escapes so they can't be lost in copy/paste.
session = { text = "\uF489", fg = "#82AAFF" }
window = { text = "\U000F10AC", fg = "lightcyan" }
pane = { text = "\uEBC8", fg = "lightgreen" }

[mode]
normal = { bg = "blue", fg = "#1b1d2b", bold = true }
input = { bg = "magenta", fg = "#1b1d2b", bold = true }
confirm = { bg = "red", fg = "#1b1d2b", bold = true }

[status]
overall = {}
label = { bold = true }
message = { fg = "lightcyan" }

[which]
border = { fg = "gray" }
key = { fg = "green" }
desc = { fg = "lightcyan" }
separator = { fg = "magenta" }

[confirm]
border = { fg = "yellow" }
title = { fg = "red" }
body = {}

[input]
border = { fg = "yellow" }
title = { fg = "red" }
value = { fg = "white" }
selected = { reversed = true }

[help]
border = { fg = "gray" }
title = { fg = "lightcyan" }
on = { fg = "green" }
run = { fg = "magenta" }
desc = { fg = "cyan" }
hovered = { reversed = true, bold = true }

[notify]
error = { fg = "red" }
